name: Synthetic ISP benchmark
on: [push, pull_request]
jobs:
  benchmark:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install . numpy
      - run: scrna-isp demo "$RUNNER_TEMP/isp-demo"
      - run: python -m unittest discover -s tests
      - run: python -m unittest discover -s standards/single-cell-isp
      - run: python -m unittest discover -s benchmarks/cardiac-isp
      - run: python patterns/test_patterns.py
