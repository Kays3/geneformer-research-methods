   <g id="text_1">
    <text style="font-weight: 700; font-size: 21px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #17324d" x="28.17" y="44.000719" transform="rotate(-0 28.17 44.000719)">A practical route through common failures</text>
   </g>
   <g id="text_2">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #586978" x="28.728" y="63.013481" transform="rotate(-0 28.728 63.013481)">Start at the symptom; confirm the cause before changing a run.</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #0072b2" x="43.236" y="117.898222" transform="rotate(-0 43.236 117.898222)">NO OR INVALID OUTPUT</text>
   </g>
   <g id="text_4">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #17324d" transform="translate(43.236 138.804175)">Check completion, NaNs</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #17324d" transform="translate(43.236 153.004175)">and the no-op control.</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #d55e00" x="272.016" y="98.494222" transform="rotate(-0 272.016 98.494222)">ALL SHIFTS ZERO?</text>
   </g>
   <g id="text_6">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #17324d" transform="translate(272.016 119.400175)">Check precision and</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #17324d" transform="translate(272.016 134.568925)">resolution.</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #d55e00" x="272.016" y="192.742222" transform="rotate(-0 272.016 192.742222)">CONSTANT SCORES?</text>
   </g>
   <g id="text_8">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #17324d" x="272.016" y="213.648175" transform="rotate(-0 272.016 213.648175)">Check collapse diagnostics.</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #00795e" x="495.216" y="117.898222" transform="rotate(-0 495.216 117.898222)">REPAIR OR STOP</text>
   </g>
   <g id="text_10">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #17324d" transform="translate(495.216 139.262769)">Trace the observed cause;</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #17324d" transform="translate(495.216 153.004175)">keep failed outputs and</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #17324d" transform="translate(495.216 167.204175)">change one thing per rerun.</text>
   </g>
   <g id="text_11">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #586978" x="30.96" y="299.7" transform="rotate(-0 30.96 299.7)">A failed gate is not evidence of no biological effect.</text>
   </g>
  </g>
