    <text style="font-weight: 700; font-size: 21px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #17324d" x="28.17" y="44.000719" transform="rotate(-0 28.17 44.000719)">From counts to a reviewed readout</text>
   </g>
   <g id="text_2">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #586978" x="28.728" y="63.013481" transform="rotate(-0 28.728 63.013481)">Each transition has an output and a check; model shifts are predictions.</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #0072b2" x="43.236" y="145.618222" transform="rotate(-0 43.236 145.618222)">Prepare</text>
   </g>
   <g id="text_4">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #17324d" transform="translate(43.236 167.492925)">Counts and</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #17324d" transform="translate(43.236 179.724956)">provenance</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #0072b2" x="150.372" y="145.619081" transform="rotate(-0 150.372 145.619081)">Tokenise</text>
   </g>
   <g id="text_6">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #17324d" transform="translate(150.372 166.524175)">Ranked gene</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #17324d" transform="translate(150.372 179.724956)">sequences</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #0072b2" x="257.508" y="145.619081" transform="rotate(-0 257.508 145.619081)">Embed</text>
   </g>
   <g id="text_8">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #17324d" transform="translate(257.508 167.492925)">Released or</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #17324d" transform="translate(257.508 181.692925)">fine-tuned</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #17324d" transform="translate(257.508 195.892925)">model</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #00795e" x="364.644" y="145.619081" transform="rotate(-0 364.644 145.619081)">Perturb</text>
   </g>
   <g id="text_10">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #17324d" transform="translate(364.644 167.492925)">Delete or move</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #17324d" transform="translate(364.644 181.692925)">a token</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #00795e" x="471.78" y="145.619081" transform="rotate(-0 471.78 145.619081)">Readout</text>
   </g>
   <g id="text_12">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #17324d" transform="translate(471.78 166.524175)">Magnitude or</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #17324d" transform="translate(471.78 181.692925)">state direction</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #00795e" x="578.916" y="145.618222" transform="rotate(-0 578.916 145.618222)">Test</text>
   </g>
   <g id="text_14">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #17324d" transform="translate(578.916 166.982769)">Matched null;</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #17324d" transform="translate(578.916 180.724175)">test by donor</text>
   </g>
   <g id="text_15">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #d55e00" x="43.236" y="281.446222" transform="rotate(-0 43.236 281.446222)">BEFORE</text>
   </g>
   <g id="text_16">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #17324d" x="43.236" y="302.352175" transform="rotate(-0 43.236 302.352175)">Fix the cohort, controls, rules and stop conditions.</text>
   </g>
   <g id="text_17">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #00795e" x="366.876" y="281.446222" transform="rotate(-0 366.876 281.446222)">AFTER</text>
   </g>
   <g id="text_18">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #17324d" transform="translate(366.876 302.810769)">Record limits; science, numbers</text>
