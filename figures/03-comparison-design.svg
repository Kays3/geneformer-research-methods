   <g id="text_1">
    <text style="font-weight: 700; font-size: 21px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #17324d" x="28.17" y="44.000719" transform="rotate(-0 28.17 44.000719)">Compare released and fine-tuned models on the same readouts</text>
   </g>
   <g id="text_2">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #586978" x="28.728" y="63.013481" transform="rotate(-0 28.728 63.013481)">Keep donor groups disjoint and hold readout cells out of training.</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #0072b2" x="46.026" y="112.354222" transform="rotate(-0 46.026 112.354222)">DONOR SPLIT</text>
   </g>
   <g id="text_4">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #17324d" transform="translate(46.026 133.260175)">Training · evaluation</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #17324d" transform="translate(46.026 148.035956)">· test / held-out cells</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #0072b2" x="227.376" y="98.494222" transform="rotate(-0 227.376 98.494222)">RELEASED MODEL</text>
   </g>
   <g id="text_6">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #17324d" x="227.376" y="119.400175" transform="rotate(-0 227.376 119.400175)">No model training.</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #d55e00" x="227.376" y="181.654222" transform="rotate(-0 227.376 181.654222)">FINE-TUNED MODEL</text>
   </g>
   <g id="text_8">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #17324d" transform="translate(227.376 202.560175)">Train only on training donors.</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #17324d" transform="translate(227.376 217.728925)">Choose on evaluation donors.</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #0072b2" x="439.416" y="98.494222" transform="rotate(-0 439.416 98.494222)">MATCHED READOUTS</text>
   </g>
   <g id="text_10">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #17324d" x="439.416" y="119.400175" transform="rotate(-0 439.416 119.400175)">Same eligible cells and operations.</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #d55e00" x="439.416" y="181.654222" transform="rotate(-0 439.416 181.654222)">GATES BEFORE ISP</text>
   </g>
   <g id="text_12">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #17324d" transform="translate(439.416 202.560175)">Classifier and collapse checks.</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #17324d" transform="translate(439.416 216.760175)">Stop the arm if a required gate fails.</text>
   </g>
   <g id="text_13">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #17324d" x="32.076" y="313.56" transform="rotate(-0 32.076 313.56)">Centroids and axes are built for each model; held-out readout cells do not train the model.</text>
   </g>
